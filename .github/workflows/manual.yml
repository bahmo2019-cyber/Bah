name: Construire APK Lions Immobilier

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install

      - name: Construire React
        run: npm run build

      - name: Installer Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Préparer APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Lions-Immobilier.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Lions-Immobilier-APK
          path: apk/Lions-Immobilier.apk
